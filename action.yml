name: 'Delivery Autopilot Runner'
description: 'Runs signed Delivery Autopilot stages in your GitHub Actions using the official Claude Code or Codex action.'
author: 'Tekunda'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  grant:
    description: 'Signed ExecutionGrant JSON issued by the control plane for this stage.'
    required: true
  verify-key:
    description: 'Ed25519 public key (PEM) used to verify the grant signature.'
    required: true
  coding-executor-config:
    description: 'Selected vendor Action config: claude-code with OAuth, or codex with an OpenAI API key. Used for judgment and coding stages.'
    required: true
  vcs-host-config:
    description: 'JSON config for the VCSHost adapter (provider + the customer''s own git host token). Used to check out the customer repo and to open the PR a coding stage produces.'
    required: true
  gate-target:
    description: 'JSON GateTarget (prNumber, branch, baseRef, changedFiles) identifying which PR/diff to run the grant''s gates against. Only used, and required, for a `gate` stage grant -- routing data, never signed (see src/runner/run-gate-stage.ts).'
    required: false
    default: '{}'
  gate-mode:
    description: 'For a `gate` stage: `fast` (default, deterministic gates against the PR checkout) or `heavy` (the dedicated stage that builds+serves the site and runs the SEO crawl / Visual-QA gates against it -- provisions a browser). Set by the control plane per the gates the grant carries.'
    required: false
    default: 'fast'
  salesforce-auth-url:
    description: >-
      The tenant's Salesforce sfdx auth URL, for the one gate that must execute IN an org:
      salesforce-deploy-validate, a check-only deploy of the PR's own metadata that also runs
      the org's local Apex tests against it. An INPUT rather than a job-level env var on
      purpose: a job-level secret is inherited by every stage this action runs -- including
      `build` and `fix`, where a coding model runs with tool access on the branch's tree, and
      including the `salesforce-lwc-jest` gate, which executes TEST CODE AUTHORED BY THE PR
      UNDER GATE. A composite action's inputs are not exported to its `run:` steps, so this
      reaches exactly one step (`Run gates`) and no other stage ever holds it.
      Optional; absent, that gate reports a skip naming the variable and never passes.
    required: false
    default: ''

outputs:
  telemetry:
    description: 'StatusTelemetry JSON reported back to the control plane.'
    value: ${{ steps.finalize.outputs.telemetry || steps.gate.outputs.telemetry || steps.prepare.outputs.telemetry }}
  result:
    description: 'Stage outcome: pass | fail | error.'
    value: ${{ steps.finalize.outputs.result || steps.gate.outputs.result || steps.prepare.outputs.result }}

runs:
  using: 'composite'
  steps:
    # EVERY third-party action below is pinned to an immutable commit SHA, with the tag it was cut
    # from in a trailing comment so the pin stays auditable and upgradable by a human.
    #
    # Why: this action runs inside the CUSTOMER's repository, holding the customer's model
    # credential and (for coding stages) a PAT with write access. A floating `@v4` / `@v1` tag is a
    # mutable pointer somebody else controls -- whoever can move that tag can run code on every
    # tenant at once, and nothing in this file would change. A SHA cannot be moved. Upgrading is a
    # deliberate edit here, reviewed like any other, and the tag comment is what makes "which
    # version is this?" answerable without a GitHub round-trip.
    #
    # The runner's OWN reference (Tekunda/autopilot-runner@v1 in .github/workflows/runner.yml) is
    # deliberately NOT a SHA: tenants must keep receiving fixes without editing their workflow. That
    # moving tag is protected on our side instead -- see docs/deploy.md, "Runner release trust".
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24

    # The runner's own source is already checked out at ${{ github.action_path }} when the
    # caller `uses:` this action — no need to re-clone the (private) repo, which also avoids
    # a distribution problem for external customers and the composite-action github.action_ref
    # unreliability. Install its deps in place.
    - name: Install runner dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    # Extract the grant's stage ONCE. GitHub's template evaluator has a cumulative
    # "Maximum object size exceeded" budget across the whole job, and re-materializing the
    # ~8-10KB signed grant with fromJSON(inputs.grant) in every step's `if:`/`ref:`/`env:`
    # overflows it and fails the run at the tail steps even when the gate itself passed. The
    # grant is passed via env (a plain string, no fromJSON) so reading it here doesn't itself
    # re-trigger the materialization; every later step reads steps.parse-grant.outputs.stage.
    - name: Parse grant stage
      id: parse-grant
      shell: bash
      env:
        INPUT_GRANT: ${{ inputs.grant }}
      run: |
        stage=$(node -e "process.stdout.write(JSON.parse(process.env.INPUT_GRANT).stage || '')")
        echo "stage=$stage" >> "$GITHUB_OUTPUT"

    # Verifies the grant and translates its prompt into the selected vendor Action step's
    # inputs below -- no git operations, no I/O beyond that (src/runner/prepare-stage.ts).
    # A rejected grant resolves telemetry here and every later step is skipped. A `gate` stage grant never reaches
    # this step at all -- see "Run gates" below.
    - name: Prepare stage
      id: prepare
      if: steps.parse-grant.outputs.stage != 'gate'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_MODE: prepare
        INPUT_GRANT: ${{ inputs.grant }}
        INPUT_VERIFY-KEY: ${{ inputs.verify-key }}
        INPUT_CODING-EXECUTOR-CONFIG: ${{ inputs.coding-executor-config }}
        # The VCS-host config lets prepare place the durable replay claim (refs/autopilot-claims/*)
        # before any vendor step runs -- the FIRST runner step for the grant, so a replayed grant
        # aborts here before any AI spend or push (src/runner/replay-claim.ts).
        INPUT_VCS-HOST-CONFIG: ${{ inputs.vcs-host-config }}
        INPUT_BASE-REF: ${{ github.event.repository.default_branch }}
      run: node src/runner/action-entry.ts

    # Deterministic Autopilot code, not the model (AGENTS.md, "deterministic control, LLM
    # only for judgment"): checks out the customer repo so there's a tree to work on --
    # at the grant's base ref for a vendor Action stage (read-only judgment or coding),
    # or at the gate target's own branch for a `gate` stage, since some gates (e.g. `cve`)
    # run real tooling against the checked-out tree, not just diff metadata.
    - name: Checkout customer repo
      if: steps.prepare.outputs.resolved == 'false' || steps.parse-grant.outputs.stage == 'gate'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history: computeChangedFiles three-dot-diffs HEAD against the base, which
        # needs the merge-base -- unreachable from a default depth-1 checkout.
        fetch-depth: 0
        ref: ${{ steps.parse-grant.outputs.stage == 'gate' && fromJSON(inputs.gate-target).branch || steps.prepare.outputs.base-ref }}
        token: ${{ fromJSON(inputs.vcs-host-config).token }}
        # Only the coding stage keeps the customer PAT persisted in .git/config -- it needs it
        # to push the build/fix branch. Every OTHER stage (architect, accept, review, plan,
        # enrich, gate) uses the token for the fetch above, then WIPES it from .git/config:
        # those stages run a vendor agent over attacker-influenceable ticket text, and a
        # persisted broad PAT is trivially readable (`cat .git/config`) and exfiltratable. A
        # non-coding checkout resolves stage-kind != 'coding' (empty for the gate stage, which
        # never pushes), so persist-credentials is false there.
        #
        # WHAT THIS DOES *NOT* DO, so nobody reads more into it than it earns: the vendor action
        # RE-ADDS a credential. claude-code-action's agent mode calls configureGitAuth ->
        # replaceCheckoutCredentials(), writing its own token into the checkout's git config on
        # every agent stage. So wiping the PAT here does not leave a judgment stage
        # credential-free -- and `accept`, the one non-coding stage that keeps Bash
        # (prepare-stage.ts baseAllowedTools), can read that token back out of the tree.
        #
        # This is still strictly better than the alternative: the token the vendor writes is the
        # one we hand it (see the `github_token` note below), scoped to this job's two
        # permissions, rather than the OIDC-minted app token carrying issues:write that it would
        # mint for itself. The load-bearing control for a stage holding attacker-influenceable
        # text remains the least-privilege TOOL set, not this flag -- and it is only for
        # `architect`, which has neither Bash nor network egress, that the credential-theft
        # channel is closed outright.
        persist-credentials: ${{ steps.prepare.outputs.stage-kind == 'coding' }}

    # The checkout's HEAD before the vendor agent touches anything. The `fix` stage's finalize
    # diffs against this to tell a real fix from a re-encoding of the same content, and this is
    # the only moment that revision is still knowable: a fix grant's own baseBranch IS the PR head
    # branch the commit-and-push step below force-pushes to, so by finalize time re-resolving it
    # yields the fix's own commit and the diff comes back empty. Recorded for every coding stage;
    # only the fix path reads it. Runs in the workspace (composite `run` steps default there).
    - name: Record pre-agent revision
      id: pre-agent
      if: steps.prepare.outputs.stage-kind == 'coding'
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # HEAVY gate stage only (docs/ci-gate-refit-plan.md §5): provision the browser the fast gate
    # path never needs. Playwright is installed into the runner's own action dir so the gate's
    # dynamic `import('playwright')` resolves here; the customer's site build/serve (yarn
    # install/build/start) runs in the checkout via the gate's own serve orchestration. The fast
    # gate path skips this step entirely, keeping heavy tooling off it.
    #
    # RUNNER-INFRA NOTE (see PR): the customer toolchain itself (yarn/pnpm and its own devDeps)
    # is assumed present after corepack; a repo whose start command needs a global CLI beyond
    # this may need an extra install line here.
    - name: Provision heavy gate stage
      if: steps.parse-grant.outputs.stage == 'gate' && inputs.gate-mode == 'heavy'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # Enable corepack ONLY when the tenant repo pins its package manager (packageManager field).
        # An unpinned repo would otherwise get corepack's mismatched default Yarn vs its classic
        # lockfile -> an opaque downstream build failure that reads as a code defect (prod incident).
        # The guard prints enable/skip and emits a ::warning:: diagnostic for the unpinned case; a
        # pinned repo behaves exactly as before (corepack enable, || true). See corepack-guard.ts.
        if [ "$(node src/runner/corepack-guard.ts)" = "enable" ]; then
          corepack enable || true
        fi
        # PINNED, exactly like every `uses:` above: `playwright@1` resolved to whatever the latest
        # 1.x was at run time, so two runs of the same grant could provision different browser
        # tooling, and a bad publish reached every tenant's heavy gate on its own schedule. Bump
        # this deliberately. `npx playwright` then resolves the version just installed.
        npm install playwright@1.62.1 --no-save
        npx playwright install --with-deps chromium

    # EVERY gate stage (fast and heavy): provision the dependency scanner the `cve` gate needs for
    # the tree shapes npm/Yarn cannot read -- Python, Go, Rust, Ruby, Java, PHP, and JavaScript's
    # own Yarn Berry and pnpm. Before this step existed, `npm audit`/`yarn audit` were the only
    # tools the gate had, so on every one of those repos the CVE audit the product page promises
    # "on every diff" quietly ran on no diff at all (see src/gates/generic/cve.ts,
    # planDependencyAudit).
    #
    # PINNED BY VERSION AND BY CHECKSUM, and deliberately NOT `curl | sh`: the release asset is
    # downloaded to a FILE, verified against the SHA-256 that osv-scanner_SHA256SUMS publishes for
    # that exact release, and only then made executable and put on PATH. Nothing from the network
    # is ever piped into a shell.
    #
    # The two failure modes are handled differently ON PURPOSE:
    #   - INTEGRITY (checksum mismatch): a supply-chain event. Fails the step loudly. A binary
    #     that is not the pinned one must never run inside a security gate.
    #   - AVAILABILITY (download failed, unsupported arch): the runner simply has no scanner. Warn
    #     and continue, and let the GATE decide what that means. It reports a merge-blocking
    #     `unjudged` (`tooling-missing`) for any tree it cannot audit without the scanner, and
    #     nothing at all for a tree with no dependency manifest -- that case is decided from the
    #     manifests, before the tool is needed. It is deliberately NOT a skip: a skip is excused by
    #     the gate's own history, so a tenant that audited once would go on reporting a benign
    #     skip forever while nothing was audited (see cve.ts's InconclusiveCause).
    #
    # Bumping the version means bumping BOTH digests, from the release's own
    # osv-scanner_SHA256SUMS.
    - name: Provision dependency scanner (osv-scanner)
      if: steps.parse-grant.outputs.stage == 'gate'
      shell: bash
      env:
        # https://github.com/google/osv-scanner/releases/tag/v2.5.1
        OSV_SCANNER_VERSION: v2.5.1
        OSV_SCANNER_SHA256_LINUX_AMD64: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        OSV_SCANNER_SHA256_LINUX_ARM64: 3d0f5aa5a6baa8eb32bcef247388e149ef6030a6634ccae6fa0d62681fb27a6d
      run: |
        set -uo pipefail
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  asset=osv-scanner_linux_amd64; want="$OSV_SCANNER_SHA256_LINUX_AMD64" ;;
          Linux/aarch64) asset=osv-scanner_linux_arm64; want="$OSV_SCANNER_SHA256_LINUX_ARM64" ;;
          *)
            echo "::warning::osv-scanner is not pinned for $(uname -s)/$(uname -m); the cve gate will report unjudged(tooling-missing) on repos it cannot audit without it"
            exit 0
            ;;
        esac
        # Cached by version AND asset in the runner's tool cache when there is one: the binary is
        # ~55 MB and this step runs for every gate stage of every subtask, so a warm or
        # self-hosted runner should pay for it once. A cache HIT is re-verified against the pinned
        # digest below rather than trusted -- anything else on the runner can write there.
        cache="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}/autopilot-osv-scanner/${OSV_SCANNER_VERSION}"
        dest="$cache/$asset"
        mkdir -p "$cache"
        url="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/${asset}"
        if [ ! -f "$dest" ]; then
          # A PRIVATE temp file per job, never a fixed "$dest.download". Two gate stages sharing a
          # self-hosted runner would otherwise write the same path concurrently: one gets a spliced
          # file, fails the digest check, and the step raises `::error::` asserting a supply-chain
          # event that did not happen -- while `rm` of the shared path poisons the other job. A
          # cancelled run leaving a stale partial behind had the same shape, one step worse: it was
          # `mv`d over a good cached binary unconditionally.
          tmp="$(mktemp "${cache}/.download.XXXXXX")" || exit 0
          # --max-time is per attempt and generous on purpose. A missing scanner is now a BLOCKING
          # unjudged, so a slow 55 MB fetch that timed out would wedge a tenant's PRs on a network
          # blip; retries plus a real budget keep that to genuine provisioning faults.
          if ! curl -fsSL --retry 5 --retry-all-errors --max-time 900 -o "$tmp" "$url"; then
            rm -f "$tmp"
            echo "::warning::osv-scanner ${OSV_SCANNER_VERSION} could not be downloaded; the cve gate will report unjudged(tooling-missing) on repos it cannot audit without it"
            exit 0
          fi
          if ! echo "${want}  ${tmp}" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$tmp"
            echo "::error::osv-scanner ${OSV_SCANNER_VERSION} ${asset} does not match its pinned SHA-256; refusing to install it"
            exit 1
          fi
          # Only a VERIFIED file is ever published to the cache path, so a concurrent reader can
          # never observe a partial or unverified binary there.
          mv -f "$tmp" "$dest"
        elif ! echo "${want}  ${dest}" | sha256sum -c - >/dev/null 2>&1; then
          # A cache entry that no longer matches is removed rather than run. Self-healing: the next
          # gate stage re-downloads it.
          rm -f "$dest"
          echo "::error::cached osv-scanner ${OSV_SCANNER_VERSION} ${asset} does not match its pinned SHA-256; refusing to run it"
          exit 1
        fi
        # PATH gets a directory holding ONLY the verified binary, under the name the gate spawns,
        # so nothing else in the cache tree is reachable through it. Read-and-execute only: this
        # directory is PREPENDED to PATH for the rest of the job, and a writable entry there is a
        # shadowing opportunity for anything the PR's own build later runs in a heavy stage.
        bin="${RUNNER_TEMP:-/tmp}/autopilot-tools"
        mkdir -p "$bin"
        # Unlock-install-relock, so re-running this step in a job that already provisioned (the
        # dir is left read-only below) is idempotent rather than a permission failure.
        chmod u+w "$bin" 2>/dev/null || true
        install -m 555 "$dest" "$bin/osv-scanner"
        chmod 555 "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        echo "osv-scanner ${OSV_SCANNER_VERSION} provisioned (${asset}, checksum verified)"

    # --- Salesforce toolchain ------------------------------------------------------------
    # The Salesforce gates are ALWAYS signed (they cannot be selected server-side, which
    # cannot see a checkout -- see src/gates/salesforce/index.ts), so the decision of whether
    # to spend minutes provisioning a toolchain has to be made HERE, against the checkout.
    # An sfdx-project.json is the same evidence detectStack uses; a repo without one gets none
    # of these steps and none of their cost, and its Salesforce gates skip benignly.
    #
    # ROOT ONLY, because that is exactly what stack-profile.ts's detectSalesforce reads
    # (`reader.readFile('sfdx-project.json')`). Matching a nested `*/sfdx-project.json` here
    # would install a JDK and provision a toolchain for a repo whose gates then all return a
    # benign `no-config` -- minutes of budget burned on every PR with nothing to show for it and
    # no signal that it happened. The two checks must name the same file or one of them is lying.
    # Runs in the customer checkout (a composite step's default working-directory), NOT in
    # ${{ github.action_path }} like the node steps below.
    - name: Detect a Salesforce checkout
      id: sf-detect
      if: steps.parse-grant.outputs.stage == 'gate'
      shell: bash
      run: |
        if [ -f sfdx-project.json ]; then
          echo "salesforce=true" >> "$GITHUB_OUTPUT"
        else
          echo "salesforce=false" >> "$GITHUB_OUTPUT"
        fi

    # The cache key is DERIVED FROM THE PINS (src/gates/salesforce/manifest.ts) rather than
    # typed here: a hand-written key is a second copy of the version numbers, and it goes stale
    # silently. Bumping a pin changes this key, so the old entry is simply not found instead of
    # being restored and then failing its digest check for reasons invisible from this file.
    - name: Salesforce toolchain cache key
      id: sf-key
      if: steps.parse-grant.outputs.stage == 'gate' && steps.sf-detect.outputs.salesforce == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      # Belt and braces on the empty case: an empty key still produces the perfectly valid cache
      # key `-Linux` below, which actions/cache accepts and every unrelated run shares. Nothing
      # downstream would go red, so the check has to be here. An explicit `if` rather than
      # `test -n "$key"` -- `-e` is on in both GitHub bash shells so either one fails the step,
      # but `test -n` leaves only `Process completed with exit code 1` and a reader has to work
      # out which of two commands died. This one names the cause, and it still fails if someone
      # overrides the shell later.
      run: |
        key="$(node src/gates/salesforce/provision-cli.ts --cache-key)"
        if [ -z "$key" ]; then
          echo "provision-cli.ts --cache-key printed nothing" >&2
          exit 1
        fi
        echo "key=$key" >> "$GITHUB_OUTPUT"

    # A cache HIT does not skip provisioning, it only saves the download. provision-cli.ts
    # re-verifies every tarball's SHA-256 on the warm path exactly as on the cold one -- the
    # warm path is the one that runs every time, so a step that verified only on a miss would
    # verify nothing in steady state. There is deliberately no `restore-keys` fallback: a
    # partial match would restore a DIFFERENT toolchain than the pins name.
    - name: Restore Salesforce toolchain
      if: steps.parse-grant.outputs.stage == 'gate' && steps.sf-detect.outputs.salesforce == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/autopilot-sf-tools
        key: ${{ steps.sf-key.outputs.key }}-${{ runner.os }}

    # Code Analyzer's `pmd` and `sfge` engines need a JVM (>= 11; both engines' own
    # MINIMUM_JAVA_VERSION). Without one they do not fail -- Code Analyzer reports the engines
    # it COULD run -- which is why the gate probes for java itself and skips rather than
    # passing. Installing it here is what makes that probe succeed instead of permanently
    # skipping the entire Apex static analysis. Python for the `flow` engine (>= 3.10) is
    # already present on GitHub's ubuntu images, so it is not installed here; if it is ever
    # absent the flow gate skips with a reason naming it, never passes.
    - name: Set up Java for Apex static analysis
      if: steps.parse-grant.outputs.stage == 'gate' && steps.sf-detect.outputs.salesforce == 'true'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '21'

    # Downloads each pinned tool to a FILE, verifies its SHA-256 against manifest.ts, and only
    # then installs from it -- never `curl | sh`, which executes bytes before it has finished
    # reading them and so cannot verify them even in principle. Exits 0 even on failure BY
    # DESIGN: a failed provisioning must not kill the job, because every Salesforce gate then
    # reports its own honest skip naming what was missing, which is strictly more useful than a
    # dead stage with no gate report at all. The step exports AUTOPILOT_SF_BIN and friends via
    # GITHUB_ENV for the "Run gates" step below.
    - name: Provision Salesforce toolchain
      if: steps.parse-grant.outputs.stage == 'gate' && steps.sf-detect.outputs.salesforce == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node src/gates/salesforce/provision-cli.ts "${{ runner.temp }}/autopilot-sf-tools"

    # THE PRODUCER FOR `salesforce-lwc-jest`. That gate runs the tenant's OWN
    # `node_modules/.bin/sfdx-lwc-jest` and deliberately never fetches one (an `npx
    # sfdx-lwc-jest` would resolve a name over the network and execute unpinned, unverified
    # bytes inside a security gate). Without this step nothing in the pipeline ever creates that
    # binary: the only other `npm ci` above runs in ${{ github.action_path }} -- the runner's own
    # dependencies, not the customer's -- and `actions/checkout` above would in any case
    # `git clean -ffdx` away anything a tenant installed before the action ran. The gate would
    # then skip on every LWC PR forever, which the ledger classes suspicious and alarms on.
    #
    # `--ignore-scripts` IS LOAD-BEARING, NOT TIDINESS. npm lifecycle scripts (preinstall,
    # postinstall, prepare) are arbitrary code, and in a gate stage they are code the PR UNDER
    # GATE authored -- a dependency it added, or a `postinstall` in its own package.json. This
    # step runs before the gate step, so it does not hold SFDX_AUTH_URL, but it does inherit the
    # job environment (ACTIONS_RUNTIME_TOKEN and friends) and it writes to the checkout the
    # later gates read. Allowing install-time execution here would re-open, one step earlier,
    # exactly the code-execution path scrubbedSubprocessEnv closes for the test run itself.
    #
    # WHAT IT COSTS A LEGITIMATE TENANT: a repo whose LWC setup genuinely needs a postinstall
    # (a native rebuild, a patch-package step) gets an install that is complete enough for
    # `sfdx-lwc-jest` to exist -- npm links bin entries regardless of scripts -- but may fail at
    # RUN time. That surfaces as a `fail` from the gate with jest's own output, not as a silent
    # pass, and salesforce-lwc-jest.blocking:false is the tenant's escape hatch while they move
    # the work out of a lifecycle script. A loud, diagnosable failure is the right trade against
    # running PR-authored install scripts on every gated PR.
    #
    # Gated three ways so no NON-Salesforce tenant pays for it: gate stage, an sfdx project, and
    # an npm lockfile. `npm ci` REQUIRES a lockfile and refuses one that disagrees with
    # package.json, which is the property we want -- an unresolvable tree must not become a
    # half-installed one. Yarn and pnpm LWC repos are deliberately NOT handled here; they fall
    # through to the gate's honest skip, which names this step.
    #
    # Exits 0 whatever happens, on purpose and for the same reason provision-cli.ts does: a
    # failed install must leave the gate to report its own honest skip naming what is missing,
    # not kill a stage that still has a dozen other gates to run.
    # A Salesforce tenant DOES pay, and without this cache it pays on every gate stage of every
    # subtask -- including pure-Apex diffs, where the gate then skips with `no-matching-files`
    # having installed a full LWC toolchain for nothing. Keyed on the lockfile hash, so it is
    # exact: a different resolved tree is a different key rather than a stale restore, and no
    # `restore-keys` fallback for the same reason (a partial match would seed node_modules with
    # a tree the lockfile does not describe, which is precisely what `npm ci` refuses to do).
    # This mirrors the osv-scanner step above, which caches for the same reason.
    #
    # Restoring node_modules is safe where restoring a package MANAGER cache would not be: the
    # install below is `--ignore-scripts`, so nothing in a restored tree executes at install
    # time, and the only consumer is sfdx-lwc-jest, which the gate resolves and runs under an
    # explicitly scrubbed environment (subprocess-env.ts) whatever produced the tree.
    - name: Restore LWC test dependencies
      if: >-
        steps.parse-grant.outputs.stage == 'gate'
        && steps.sf-detect.outputs.salesforce == 'true'
        && hashFiles('package-lock.json') != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: autopilot-lwc-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install LWC test dependencies
      if: >-
        steps.parse-grant.outputs.stage == 'gate'
        && steps.sf-detect.outputs.salesforce == 'true'
        && hashFiles('package-lock.json') != ''
      shell: bash
      run: |
        # A cache hit already put the tree in place; `npm ci` would delete and rebuild it, which
        # is the whole cost this cache exists to avoid. Re-running it only when the runner the
        # gate actually spawns is absent keeps the check on the thing that matters -- the binary
        # -- rather than on the cache step's own outcome.
        if [ -x node_modules/.bin/sfdx-lwc-jest ]; then
          echo "LWC test dependencies restored from cache"
        elif npm ci --ignore-scripts --no-audit --no-fund; then
          echo "LWC test dependencies installed (lifecycle scripts skipped)"
        else
          echo "::warning::npm ci failed in the customer checkout; salesforce-lwc-jest will report a skip naming its missing runner"
        fi

    # Runs only for a `gate` stage grant: verifies the grant, builds a GateContext from the
    # checked-out tree above, and runs exactly the gates named in the grant's signed
    # `gateSpecs` -- never a gate outside that set, even if it's registered runner-side (see
    # src/runner/run-gate-stage.ts, issues #106, #129). `gate-mode: heavy` selects the dedicated
    # stage (src/runner/serve-and-gate.ts) that builds+serves the site and runs the browser/
    # server-capable gates (SEO crawl, Visual-QA) against the served instance; `fast` (default)
    # runs the deterministic gates against the PR checkout only, with no model and no browser.
    # Resolves telemetry right here; no vendor Action step and no finalize phase follow it.
    - name: Run gates
      id: gate
      if: steps.parse-grant.outputs.stage == 'gate'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_MODE: ${{ inputs.gate-mode == 'heavy' && 'heavy-gate' || 'gate' }}
        INPUT_GRANT: ${{ inputs.grant }}
        INPUT_VERIFY-KEY: ${{ inputs.verify-key }}
        INPUT_VCS-HOST-CONFIG: ${{ inputs.vcs-host-config }}
        INPUT_GATE-TARGET: ${{ inputs.gate-target }}
        # The heavy stage's Visual-QA vision judge authenticates with the tenant's executor
        # credential -- the SAME coding-executor-config the reviewer/architect vendor steps use
        # (src/runner/adapters.ts executorCredential). Carries either the OAuth/subscription token
        # or the raw API key, so an OAuth tenant's Visual-QA runs on their subscription instead of
        # failing closed for lack of a standalone ANTHROPIC_API_KEY.
        INPUT_CODING-EXECUTOR-CONFIG: ${{ inputs.coding-executor-config }}
        # The Salesforce org credential, present ONLY on this step. src/gates/salesforce/org.ts
        # never reads its VALUE -- it resolves the variable's NAME and lets a child `sh -c`
        # expand it into `sf org login sfdx-url --sfdx-url-stdin`, so the secret never enters
        # the runner's Node process and never reaches argv (world-readable at
        # /proc/<pid>/cmdline). Scoping it here is the OTHER half of that defence: the gate
        # stage runs subprocesses over PR-authored code (sfdx-lwc-jest runs the branch's own
        # test files; ESLint and PMD parse them), and those subprocesses get an explicitly
        # SCRUBBED environment (gates/salesforce/subprocess-env.ts) rather than an inherited one.
        SFDX_AUTH_URL: ${{ inputs.salesforce-auth-url }}
      run: node src/runner/action-entry.ts

    # Upload the per-gate results+findings the "Run gates" step wrote (the StatusTelemetry
    # JSON from action-entry.ts gate mode): job names alone can't say WHICH gate failed or
    # why, so the control plane's CIRunner replaces them with these reported checks
    # (src/adapters/github-actions/ci-runner.ts). always() is load-bearing: a failing gate
    # makes the step above exit 1, and a plain `if` would then be skipped as failed --
    # exactly the case whose findings matter most. A rejected grant still writes its error
    # telemetry, which uploads with empty checks -- harmless: the control plane ignores
    # such a report and falls back to job-name checks. if-no-files-found keeps a missing
    # file a skip, not an error.
    - name: Upload gate report
      if: always() && steps.parse-grant.outputs.stage == 'gate'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: gate-report
        path: gate-report.json
        if-no-files-found: ignore

    # bot_id must be the numeric prefix of the committer noreply email. The email comes from the
    # SIGNED grant (prepare emits it as committer-email -- Autopilot's own bot identity, sourced
    # by the control plane, NOT the customer's vcs-host-config). GitHub Actions expressions have
    # no split(), so derive the id in bash from that email instead.
    - name: Resolve committer bot id
      id: commit-id
      shell: bash
      env:
        COMMITTER_EMAIL: ${{ steps.prepare.outputs.committer-email || '41898282+github-actions[bot]@users.noreply.github.com' }}
      run: |
        id="${COMMITTER_EMAIL%%+*}"
        case "$COMMITTER_EMAIL" in *+*) ;; *) id="41898282" ;; esac
        echo "id=$id" >> "$GITHUB_OUTPUT"

    # The ONLY non-deterministic, non-ours step (issue #70's settled execution boundary):
    # the selected vendor Action performs read-only judgment or edits the checkout. Git
    # control stays in the deterministic step below, shared by both vendors (issue #113).
    - name: Run with claude-code-action
      id: claude
      if: steps.prepare.outputs.resolved == 'false' && fromJSON(inputs.coding-executor-config).provider == 'claude-code'
      uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
      with:
        claude_code_oauth_token: ${{ fromJSON(inputs.coding-executor-config).oauthToken || '' }}
        anthropic_api_key: ${{ fromJSON(inputs.coding-executor-config).apiKey || '' }}
        # Only the coding stage (which pushes) receives the customer PAT. Every read-only /
        # judgment stage gets the AMBIENT job token instead: it touches no GitHub API, only the
        # local checkout and plan.json, so it needs no broad credential -- and withholding the PAT
        # keeps it out of a stage whose prompt carries attacker-influenceable ticket text. The
        # ambient token is scoped to exactly the two permissions runner.yml declares
        # (contents: write, pull-requests: write) and dies with the job.
        #
        # It is NOT `''`, and the comment that used to sit here claiming claude-code-action
        # "tolerates an empty github_token and falls back to the ambient github.token" was WRONG in
        # the way that matters. Read the pinned vendor source: its action.yml sets
        # `OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}` with no fallback, and
        # src/github/token.ts setupGitHubToken() does `if (providedToken) { return }` then falls
        # straight through to getOidcToken(), which THROWS
        # "Could not fetch an OIDC token. Did you remember to add `id-token: write`". An empty
        # string is falsy, so every non-coding stage would have taken the OIDC path. The
        # `inputs.github_token || github.token` fallbacks in that action exist only in its
        # setup-bun checkout and cleanup steps, not on this path.
        #
        # So passing a real token here is what lets `id-token: write` be dropped from runner.yml.
        # The alternative -- letting the vendor mint an App token over OIDC -- is strictly worse:
        # it grants contents+pull_requests+ISSUES write, minted through a third-party exchange
        # endpoint, to the stage we least want holding credentials.
        #
        # NOTE (follow-on): the ideal is still a read-only token for judgment stages. Job-level
        # `permissions:` cannot express that, since one job runs every stage kind -- it needs the
        # runner workflow split per stage kind, which is a tenant-template change.
        github_token: ${{ steps.prepare.outputs.stage-kind == 'coding' && fromJSON(inputs.vcs-host-config).token || github.token }}
        allowed_bots: 'delivery-autopilot'
        prompt: ${{ steps.prepare.outputs.prompt }}
        base_branch: ${{ steps.prepare.outputs.base-ref }}
        # Commit identity for the edits this Action makes and commits itself. Without these it
        # defaults to bot_name "claude[bot]" (id 41898282), so the pushed coding commit would be
        # authored claude[bot] and the deterministic step's identity override below would be a
        # no-op (nothing left to commit). Sourced from the SIGNED grant (prepare emits
        # committer-name/committer-email -- Autopilot's own bot identity, resolved by the control
        # plane, NOT the customer's vcs-host-config) so every pipeline commit -- vendor-made or
        # deterministic -- carries the SAME non-claude identity. bot_id is the numeric prefix of
        # committer-email; the Action rebuilds the address as
        # "<bot_id>+<bot_name>@users.noreply.github.com", matching committer-email.
        bot_name: ${{ steps.prepare.outputs.committer-name || 'github-actions[bot]' }}
        bot_id: ${{ steps.commit-id.outputs.id }}
        # `--model` carries the grant's signed modelTier (prepare resolves it via
        # src/config/model-tiers.ts): a "deep" stage runs on the deep model instead of
        # claude-code-action's own default. Empty only for an unmapped provider.
        # The tool allow-list is no longer assembled here: prepare emits the least-privilege
        # set (`allowed-tools`) derived from the SIGNED grant stage, with any authorized MCP
        # tool names already appended (src/runner/prepare-stage.ts baseAllowedTools). Moving it
        # server-side makes the allow-list deterministic and testable rather than a YAML
        # ternary a later edit could silently widen -- architect/review/enrich get read-only
        # (no shell, no network egress); accept keeps a shell to run gates; only coding keeps
        # the shell + Edit. --max-turns stays here (coding only). The --mcp-config <file> the
        # tenant's MCP servers need (only ${ENV} placeholders, no secret) is still passed below.
        claude_args: >-
          ${{ format('--allowedTools "{0}"', steps.prepare.outputs.allowed-tools) }}${{ steps.prepare.outputs.stage-kind == 'coding' && ' --max-turns 200' || '' }}
          ${{ steps.prepare.outputs.model && format('--model {0}', steps.prepare.outputs.model) || '' }}
          ${{ steps.prepare.outputs.mcp-config-path && format('--mcp-config {0}', steps.prepare.outputs.mcp-config-path) || '' }}
        # The grant's signed debug.showFullOutput toggle (off by default -- see
        # config/types.ts DebugConfig): reveals the raw Claude Code SDK output for this run
        # instead of the minimal {is_error, duration_ms, ...} summary, so a failure's actual
        # reason (rate/usage limit vs. a real error) is visible in the log.
        show_full_output: ${{ steps.prepare.outputs.show-full-output || 'false' }}
        # The grant's signed Claude Code plugin access (server-resolved from the tenant's
        # config): marketplace git URLs to register and `pluginName@marketplaceName` plugins to
        # install, newline-separated. Empty when the tenant configured none.
        plugin_marketplaces: ${{ steps.prepare.outputs.plugin-marketplaces || '' }}
        plugins: ${{ steps.prepare.outputs.plugins || '' }}

    - name: Run with codex-action
      id: codex
      if: steps.prepare.outputs.resolved == 'false' && fromJSON(inputs.coding-executor-config).provider == 'codex'
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      with:
        openai-api-key: ${{ fromJSON(inputs.coding-executor-config).apiKey }}
        responses-api-endpoint: ${{ fromJSON(inputs.coding-executor-config).responsesApiEndpoint || '' }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        # Same tier resolution as the Claude step: prepare has already applied the
        # customer's own configured model when there is one, so this output is the
        # single source of truth for which model runs.
        model: ${{ steps.prepare.outputs.model || fromJSON(inputs.coding-executor-config).model || '' }}
        effort: ${{ fromJSON(inputs.coding-executor-config).effort || steps.prepare.outputs.effort || '' }}
        permission-profile: ${{ (steps.prepare.outputs.stage-kind == 'coding' || steps.prepare.outputs.stage-kind == 'architect') && ':workspace' || ':read-only' }}
        allow-bots: true

    # The architect stage writes its file-disjoint subtask plan to plan.json in the
    # checked-out tree (never committed -- architect is not a coding stage). Upload it as a
    # workflow artifact so the control plane's CIRunner can download and parse it back into
    # StageResult.subtasks (src/adapters/github-actions/ci-runner.ts). A run that produced no
    # plan uploads nothing, which surfaces as a failed decomposition that blocks the ticket.
    - name: Upload architect plan
      if: steps.prepare.outputs.stage-kind == 'architect'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: plan
        path: plan.json
        if-no-files-found: ignore

    - name: Commit and push coding result
      if: >-
        steps.prepare.outputs.stage-kind == 'coding' &&
        (steps.claude.conclusion == 'success' || steps.codex.conclusion == 'success')
      shell: bash
      env:
        BRANCH_NAME: ${{ steps.prepare.outputs.branch-name }}
        BASE_REF: ${{ steps.prepare.outputs.base-ref }}
        STAGE: ${{ steps.parse-grant.outputs.stage }}
        # Single source for the git identity of every pushed pipeline commit (this step's own
        # commit for the codex/no-vendor-commit path, and the identity the claude step is told
        # to use above): the SIGNED grant's committer, emitted by prepare -- Autopilot's own bot,
        # resolved by the control plane, NOT the customer's vcs-host-config. Defaults to
        # github-actions[bot] -- valid on any repo, never claude.
        COMMITTER_NAME: ${{ steps.prepare.outputs.committer-name || 'github-actions[bot]' }}
        COMMITTER_EMAIL: ${{ steps.prepare.outputs.committer-email || '41898282+github-actions[bot]@users.noreply.github.com' }}
        # The revision this checkout was at BEFORE the agent ran. The conflict-marker scan below
        # diffs the index against it so it judges only what THIS STAGE staged -- `git add -A` makes
        # the index the whole tree, and an unscoped scan would refuse the push for any file already
        # committed in the customer's repo that happens to document a merge conflict.
        PRE_AGENT_SHA: ${{ steps.pre-agent.outputs.sha }}
      run: |
        git config user.name "$COMMITTER_NAME"
        git config user.email "$COMMITTER_EMAIL"
        git switch -C "$BRANCH_NAME"
        # Everything the agent touched EXCEPT its dispute file. A fix stage that judges a gate
        # finding to be a false positive writes autopilot-fix-dispute.json and changes nothing
        # else; the finalize step reads it out of the working tree and reports it as the round's
        # verdict, so it must never become a commit -- "changed nothing" has to mean nothing.
        git add -A -- . ':(exclude)autopilot-fix-dispute.json'
        # REFUSE A HALF-RESOLVED MERGE (src/runner/conflict-markers.ts). `git add -A` will happily
        # stage a file still carrying `<<<<<<< HEAD`, and the commit + force-push below would put
        # literal markers into the branch and the PR diff. The scan reads the INDEX -- exactly what
        # is about to be committed -- restricted to the paths this stage staged since
        # $PRE_AGENT_SHA, so a pre-existing file in the customer's repo that documents a conflict is
        # never judged. It is TypeScript, not bash inlined here, so it is unit tested and so the
        # failure can name every offending file and line. Non-zero exit fails this step
        # (bash -eo pipefail), and nothing below it runs.
        AUTOPILOT_PRE_AGENT_SHA="$PRE_AGENT_SHA" node "${{ github.action_path }}/src/runner/conflict-markers.ts"
        if ! git diff --cached --quiet; then
          git commit -m "Delivery Autopilot: $STAGE"
        fi
        # Empirical identity check: prove no pushed commit is authored claude[bot]. Lists every
        # commit this stage adds on top of base with its author AND committer.
        echo "Pipeline commit identities ($BASE_REF..HEAD):"
        git log "origin/$BASE_REF..HEAD" --format='%h %an <%ae> / %cn <%ce>' || true
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BASE_REF")" ]; then
          # Two push modes, by branch ownership:
          #   * autopilot/* -- a deterministic build branch solely owned by Autopilot: FORCE-push,
          #     so a fix-loop / retry re-run legitimately REPLACES the branch a prior attempt left
          #     (a plain push would be rejected non-fast-forward and wedge the ticket on retry).
          #   * anything else -- a real, human/shared branch that is a PR head we're fixing onto
          #     (an external PR like test->main, a back-merge sync branch): PLAIN fast-forward
          #     push, never force. Our commit sits on top of the checked-out head, so this is a
          #     ff; if the head moved under us the push is rejected (safe) and the next tick's
          #     conflict-resolve merges the base in and retries -- the old workflows' approach.
          #     This must NOT be a force-push: force-pushing a real branch would clobber history.
          case "$BRANCH_NAME" in
            autopilot/*) git push --force origin "HEAD:refs/heads/$BRANCH_NAME" ;;
            *) git push origin "HEAD:refs/heads/$BRANCH_NAME" ;;
          esac
        fi

    # Deterministic Autopilot code again: confirms, via VCSHost, that the deterministic
    # branch prepare told the agent to use actually landed on the remote with commits
    # beyond base -- never trusting the vendor step's own conclusion/branch_name outputs
    # for that (src/runner/finalize-stage.ts) -- then maps the confirmed outcome to an
    # ExecutorResult and, only if a branch resulted, opens the PR from it via VCSHost. The
    # model never opens the PR itself. No commits landing is reported as a valid no-op,
    # not a phantom PR.
    - name: Finalize stage
      id: finalize
      # always(): must still run -- and report a graceful `error` telemetry -- even if the
      # vendor Action step above failed outright rather than resolving to conclusion:
      # failure. Gated on resolved == 'false' (not just != 'true') so a prepare step that
      # crashed before writing any output (e.g. a malformed grant) doesn't retry finalize
      # with the same bad input.
      if: always() && steps.prepare.outputs.resolved == 'false'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_MODE: finalize
        INPUT_GRANT: ${{ inputs.grant }}
        INPUT_VERIFY-KEY: ${{ inputs.verify-key }}
        INPUT_CODING-EXECUTOR-CONFIG: ${{ inputs.coding-executor-config }}
        INPUT_VCS-HOST-CONFIG: ${{ inputs.vcs-host-config }}
        INPUT_ACTION-CONCLUSION: ${{ fromJSON(inputs.coding-executor-config).provider == 'claude-code' && steps.claude.conclusion || steps.codex.conclusion }}
        INPUT_BASE-REF: ${{ github.event.repository.default_branch }}
        INPUT_PRE-AGENT-SHA: ${{ steps.pre-agent.outputs.sha }}
      run: node src/runner/action-entry.ts

    # The fix stage's own verdict on the round it just ran (disputed findings, encoding
    # evasions), written into the workspace by the finalize step above. GitHub exposes no API
    # for a dispatched run's step outputs, so this artifact is the only channel that verdict
    # can travel back on -- exactly like the gate stage's gate-report.json. always(), because
    # a fix that FAILED its own verdict is precisely the one whose reason must reach the
    # control plane.
    - name: Upload fix report
      if: always() && steps.parse-grant.outputs.stage == 'fix'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: fix-report
        path: fix-report.json
        if-no-files-found: ignore
